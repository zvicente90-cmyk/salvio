version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: salvio
      POSTGRES_PASSWORD: salvio_pass
      POSTGRES_DB: salvio_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@salvio.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '8080:80'
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - '8000:8000'
    depends_on:
      - postgres
    volumes:
      - ./:/app
    working_dir: /app
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
